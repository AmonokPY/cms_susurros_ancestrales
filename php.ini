; Configuración PHP de producción — Azure App Service (PHP 8.3.x / 8.4)
; Remediación OWASP ZAP:
; - [ALTO · CWE-1395] / [BAJO · CWE-497]: Ocultar versión de PHP en cabecera X-Powered-By
; - [Insight ZAP] 98% respuestas lentas: Activar y ajustar OPcache en producción
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; OPcache para rendimiento en producción
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.save_comments = 1
