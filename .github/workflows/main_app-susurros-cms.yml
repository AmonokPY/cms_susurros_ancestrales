# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - app-susurros-cms

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (Latest patched 8.3.x)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, openssl, pdo, pdo_mysql, tokenizer, curl, zip, opcache
          ini-values: expose_php=Off, opcache.enable=1
          coverage: none

      - name: Install Composer dependencies
        run: composer validate --no-check-publish && composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Security Audit (Composer Audit — Fail on High/Critical)
        run: |
          AUDIT_JSON=$(composer audit --no-dev --format=json || true)
          echo "$AUDIT_JSON"
          php -r '
            $data = json_decode($argv[1], true);
            $advisories = $data["advisories"] ?? [];
            $blocking = [];
            foreach ($advisories as $pkg => $items) {
                foreach ($items as $adv) {
                    $sev = strtolower((string) ($adv["severity"] ?? "high"));
                    if (in_array($sev, ["high", "critical"], true)) {
                        $blocking[] = $pkg . ": " . ($adv["advisoryId"] ?? $adv["cve"] ?? "unknown") . " (" . $sev . ")";
                    }
                }
            }
            if (!empty($blocking)) {
                fwrite(STDERR, "Vulnerabilidades High/Critical detectadas:\n" . implode("\n", $blocking) . "\n");
                exit(1);
            }
          ' "$AUDIT_JSON"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Precompile Laravel Blade views
        run: php artisan view:cache

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          include-hidden-files: false
          path: |
            app
            bootstrap
            config
            database
            public
            resources
            routes
            storage
            vendor
            artisan
            composer.json
            composer.lock
            default
            php.ini
            startup.sh
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_69C5EC610FFA4F408ABBE0E347485CBD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B186754F462A4804B883776294EE6CAD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C61204105A06442BA2F0A43A90342B96 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'app-susurros-cms'
          slot-name: 'Production'
          package: .
